version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/tutterfly_crm
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=your-secret-key-change-this-in-production
    depends_on:
      - mongodb
      - redis
    networks:
      - tutterfly-network

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.account_tasks.celery_app worker --loglevel=info
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/tutterfly_crm
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
    depends_on:
      - mongodb
      - redis
    networks:
      - tutterfly-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - tutterfly-network

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    networks:
      - tutterfly-network

networks:
  tutterfly-network:
    driver: bridge

volumes:
  mongo-data:
