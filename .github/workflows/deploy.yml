name: Deploy (EC2 + Vercel)

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend-only
          - frontend-only
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      force_rebuild:
        description: "Force rebuild backend image without cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: tutterfly-backend

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'backend-only'))
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: ${{ github.event.inputs.force_rebuild == 'true' && '' || format('type=registry,ref={0}/{1}:buildcache', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) }}
          cache-to: ${{ github.event.inputs.force_rebuild == 'true' && '' || format('type=registry,ref={0}/{1}:buildcache,mode=max', steps.login-ecr.outputs.registry, env.ECR_REPOSITORY) }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-and-push-backend
    if: always() && needs.build-and-push-backend.result == 'success'
    steps:
      - name: Deploy backend on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            REGION="${{ env.AWS_REGION }}"
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            aws ecr get-login-password --region "$REGION" | \
              docker login --username AWS --password-stdin "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com"
            cd /opt/apps/tutterfly
            docker compose pull tutterfly-backend
            docker compose up -d tutterfly-backend
            docker image prune -a -f

  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'frontend-only'))
    steps:
      - name: Trigger Vercel deploy
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          elif [ -n "${{ secrets.VERCEL_HOOK_ADMIN }}" ]; then
            curl -X POST "${{ secrets.VERCEL_HOOK_ADMIN }}"
          else
            echo "No Vercel deploy hook secret set (VERCEL_DEPLOY_HOOK or VERCEL_HOOK_ADMIN)"
          fi
